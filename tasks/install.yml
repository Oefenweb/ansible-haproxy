# tasks file
---
- name: install | dependencies
  ansible.builtin.apt:
    name: "{{ dep.name }}"
    state: "{{ dep.state }}"
  loop: "{{ haproxy_dependencies }}"
  loop_control:
    loop_var: dep
  tags:
    - haproxy-install-dependencies

- name: install | additional
  ansible.builtin.apt:
    name: "{{ haproxy_install }}"
    state: "{{ apt_install_state | default('latest') }}"
  tags:
    - haproxy-install-additional
